<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina web</title>
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <!-- Iconos de Google -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <!-- Estilos principales -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <nav class="header__nav">
            <!-- Grupo izquierdo -->
            <ul class="header__list">
                <li class="header__item">
                    <a href="#" class="header__link">Docs</a>
                </li>
                <li class="header__item">
                    <a href="#" class="header__link">Support</a>
                </li>
                <li class="header__item">
                    <a href="#" class="header__link">Download</a>
                </li>
            </ul>
            <!-- Grupo derecho -->
            <ul class="header__list">
                <li class="header__item">
                    <button class="header__search" type="button" aria-label="Buscar">
                        <span class="material-symbols-outlined">search</span>
                    </button>
                </li>
                <li class="header__item">
                    <a href="#" class="header__link">Public Sector</a>
                </li>
                <li class="header__item">
                    <a href="#" class="header__link">Company</a>
                </li>
                <li class="header__item">
                    <a href="#" class="header__link">Login</a>
                </li>
            </ul>

        </nav>
        <nav class="header__main-nav">

            <!-- Logotipo -->
            <a href="#" class="header__logo-link">
                <img src="https://www.zerotier.com/wp-content/uploads/2025/10/ZeroTier-Gold-and-Black-Logo-Filled-Inverted.svg"
                    alt="ZeroTier" class="header__logo">
            </a>

            <!-- Enlaces principales -->
            <ul class="header__main-list">

                <li class="header__main-item">
                    <a href="#" class="header__main-link">Platform</a>
                </li>

                <li class="header__main-item">
                    <a href="#" class="header__main-link">
                        Industries
                        <span class="material-symbols-outlined">arrow_drop_down</span>
                    </a>
                </li>

                <li class="header__main-item">
                    <a href="#" class="header__main-link">
                        Resources
                        <span class="material-symbols-outlined">arrow_drop_down</span>
                    </a>
                </li>

                <li class="header__main-item">
                    <a href="#" class="header__main-link">Pricing</a>
                </li>

                <li class="header__main-item">
                    <a href="#" class="header__main-link">Partners</a>
                </li>

            </ul>

            <!-- Botones de acción -->
            <div class="header__actions">

                <a href="#" class="header__start">
                    <span class="material-symbols-outlined">rocket_launch</span>
                    Start Free
                </a>

                <a href="#" class="header__contact">
                    <span class="material-symbols-outlined">forum</span>
                    Connect With Us
                </a>

            </div>

        </nav>
    </header>
</body>

</html>
